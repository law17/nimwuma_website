<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.company.brand.name }}</title>
  <meta name="description" content="{{ page.description | default: site.data.company.description | escape }}">
  {% if site.staging or page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="theme-color" content="#142A3A">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="page-{{ page.page_class | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
