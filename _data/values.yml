- name: "Accountability"
  description: "We take responsibility for the quality of the work we perform. Technology supports our people; it does not remove responsibility."
- name: "Reliability"
  description: "Recurring work should not depend on memory or individual availability. We build systems and processes that make delivery consistent."
- name: "Clarity"
  description: "Business information should help people understand what happened, why it matters and what needs attention."
- name: "Intelligence"
  description: "We use data, technology and careful judgement to improve the way work is performed."
- name: "Security & Trust"
  description: "Access to client information is a responsibility. We use controlled systems, appropriate permissions and careful data handling."
- name: "Continuous Improvement"
  description: "Repeated work should become simpler, faster, more accurate and more measurable over time."
