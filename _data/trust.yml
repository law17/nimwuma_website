- title: "Human accountability"
  text: "Technology assists our work, but responsibility does not disappear behind automation."
- title: "Role-based access"
  text: "Client information is accessed only by people and systems that need it for authorised work."
- title: "Controlled credentials"
  text: "Business access is managed through company-controlled systems rather than personal password sharing."
- title: "Client-data separation"
  text: "Client information is kept logically separated and handled according to defined permissions."
- title: "Approved AI use"
  text: "AI tools and workflows are governed by defined use cases, data minimisation and appropriate human review."
- title: "Client financial authority"
  text: "Financial processes can be administered without transferring payment authority or sensitive financial decisions away from the client."
